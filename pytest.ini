[pytest]
testpaths = tests
# Keep addopts limited to CORE options only. Do NOT put plugin-provided flags here
# (e.g. pytest-timeout's --timeout): if the plugin isn't active, pytest aborts every
# invocation with a usage error (exit 4). The autouse reaper fixture in conftest.py
# prevents the multiprocessing shutdown hang, so a hard timeout isn't required for a
# clean run; pass --timeout explicitly when you want it and the plugin is installed.
addopts = --strict-markers
markers =
    integration: spawns real processes/threads; excluded from coverage runs (run for pass/fail)
    hardware: interacts with hardware mocks
    slow: slow to execute

# Coverage is measured on unit/logic tests only:
#   pytest -m "not integration" --cov
# Full pass/fail (including process integration tests):
#   pytest
