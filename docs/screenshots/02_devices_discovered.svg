<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#2d2d44"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#45475a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="700.0" y="410.0"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#cdd6f4"
        text-anchor="middle">
    Devices Discovered
  </text>

  <!-- Description -->
  <text x="700.0" y="470.0"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#a6adc8"
        text-anchor="middle">
    Multiple devices found and listed
  </text>

  <!-- Filename -->
  <text x="700.0" y="510.0"
        font-family="monospace"
        font-size="18"
        fill="#7f849c"
        text-anchor="middle">
    02_devices_discovered.png
  </text>

  <!-- Watermark -->
  <text x="700.0" y="870"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#585b70"
        text-anchor="middle"
        opacity="0.7">
    StreamSense Placeholder - Run 'python scripts/capture_ui_screenshots.py' for real screenshots
  </text>
</svg>
